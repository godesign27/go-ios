name: GoLauncher
options:
  bundleIdPrefix: com.godesign
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GoLauncher:
    type: application
    platform: iOS
    sources:
      - path: GoLauncher
    info:
      path: GoLauncher/Info.plist
      properties:
        CFBundleDisplayName: Go
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Go uses your location only to show local weather in the Weather widget.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.godesign.golauncher
            CFBundleURLSchemes:
              - golauncher
    settings:
      base:
        # Change this to something unique to you (e.g. com.yourname.golauncher)
        PRODUCT_BUNDLE_IDENTIFIER: com.godesign.golauncher
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
