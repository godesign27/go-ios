name: GoLauncher
options:
  bundleIdPrefix: com.godesign
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GoLauncher:
    type: application
    platform: iOS
    # A shared scheme, so command-line builds (scripts/testflight.sh) can find it.
    scheme:
      testTargets:
        - GoLauncherTests
        - GoLauncherUITests
    sources:
      - path: GoLauncher
    # The Home Screen widgets and Go Search control ship inside the app.
    dependencies:
      - target: GoWidgets
    # Shared folder for the layout, so widgets show what the app saves.
    entitlements:
      path: Config/GoLauncher.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.godesign.golauncher
    info:
      path: GoLauncher/Info.plist
      properties:
        CFBundleDisplayName: Go
        # Read from build settings, so testflight.sh's timestamp build number reaches the upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Only standard HTTPS is used, so uploads skip the export-compliance question.
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Go uses your location only to show local weather in the Weather widget.
        NSPhotoLibraryAddUsageDescription: Go saves your background to Photos so you can use it as your iPhone wallpaper.
        # Lets Go check which catalog apps are installed (canOpenURL). Apple: apps linked on
        # or after iOS 27 may list at most 25 schemes (50 before), and Go builds with the iOS 27
        # SDK. Order = priority. Other catalog apps still open and can be added by hand; they're
        # just not detected automatically. GoLauncherTests checks the count and the names.
        # Not listed (not auto-detected): fb-messenger, barcelona, snssdk1233, snapchat, tg, reddit, pinterest, aiv, disneyplus, hulu, twitch, shazam, googlephotos, duolingo, strava, lyft, waze, com.amazon.mobile.shopping, airbnb, doordash, paypal, squarecash, sgnl
        LSApplicationQueriesSchemes:
          - googlegmail
          - ms-outlook
          - slack
          - msteams
          - zoomus
          - notion
          - googledrive
          - googlechrome
          - whatsapp
          - instagram
          - fb
          - linkedin
          - twitter
          - discord
          - spotify
          - youtube
          - nflx
          - comgooglemaps
          - uber
          - venmo
          - chatgpt
          - claude
          - googlegemini
          - perplexity-app
          - ms-copilot
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.godesign.golauncher
            CFBundleURLSchemes:
              - golauncher
    settings:
      base:
        # Registered App ID (developer.apple.com > Identifiers: "GO iOS app experience")
        PRODUCT_BUNDLE_IDENTIFIER: com.godesign.golauncher
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # GO design, Inc. Kept here so regenerating the project doesn't clear the Team.
        DEVELOPMENT_TEAM: TTM6RL99QG

  # Unit tests for saved-layout compatibility (fixtures from real builds), backups and the
  # catalog. Run: xcodebuild test -scheme GoLauncher -destination 'platform=iOS Simulator,name=iPhone 17'
  GoLauncherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GoLauncherTests
    dependencies:
      - target: GoLauncher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godesign.golauncher.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GoLauncher.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/GoLauncher
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: TTM6RL99QG

  # Apple's automated accessibility audit on Classic Launcher and setup.
  GoLauncherUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GoLauncherUITests
    dependencies:
      - target: GoLauncher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godesign.golauncher.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GoLauncher
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: TTM6RL99QG

  # Home Screen widgets ("Go Section") and the Go Search control for Control Center,
  # the Lock Screen and the Action Button. iOS 18+ (interactive widgets that open apps,
  # controls); the app itself still runs on iOS 17.
  GoWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: GoWidgets
      - path: GoLauncher/Models
      - path: GoLauncher/Shared
      - path: GoLauncher/Support/ColorHex.swift
    info:
      path: Config/GoWidgets-Info.plist
      properties:
        CFBundleDisplayName: Go
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/GoWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.godesign.golauncher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godesign.golauncher.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: TTM6RL99QG
        SKIP_INSTALL: YES
